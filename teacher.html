<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#126c65">
  <title>교사용 수식 자료 · 픽토그램 수업 연구실</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#172d3c;background:#f6f5f0;line-height:1.55;font-size:16px;--teal:#126c65;--line:#dce5e1;--sub:#5c707b}
    *{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a{color:inherit}button{cursor:pointer}a{color:var(--teal);text-decoration:none}a:hover{text-decoration:underline}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e4ab4c;outline-offset:3px}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px max(20px,calc((100% - 1180px)/2));background:#fff;border-bottom:1px solid var(--line)}header h1{margin:0;font-size:19px}header nav{display:flex;gap:9px;align-items:center}.button{min-height:42px;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:700}.button.primary{background:var(--teal);border-color:var(--teal);color:#fff}.button:disabled{opacity:.55;cursor:not-allowed}
    main{max-width:1180px;margin:0 auto;padding:24px 20px 50px}.login{max-width:420px;margin:8vh auto 0;padding:24px;background:#fff;border:1px solid var(--line);border-radius:8px}.login h2{margin:0 0 18px;font-size:22px}.login label{display:block;margin-bottom:7px;font-weight:700}.login input{width:100%;min-height:46px;padding:10px 12px;border:1px solid #aebfba;border-radius:6px}.login button{width:100%;margin-top:14px}.error{min-height:24px;margin:8px 0 0;color:#a44735;font-size:14px}.workspace[hidden],.login[hidden],header [hidden]{display:none}
    .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:18px}.toolbar label{font-weight:700}.toolbar select{min-height:42px;min-width:210px;padding:8px 32px 8px 10px;border:1px solid #aebfba;border-radius:6px;background:#fff}.workspace-grid{display:grid;grid-template-columns:minmax(300px,.8fr) minmax(0,1.2fr);gap:24px;align-items:start}.preview{position:sticky;top:18px;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}.preview h2,.equations h2{margin:0;padding:15px 17px;border-bottom:1px solid var(--line);font-size:18px}.drawing{padding:12px}.drawing svg{display:block;width:100%;height:auto}.shape{stroke:#193a47;stroke-width:.11;fill:none;stroke-linecap:round;stroke-linejoin:round}.gridline{stroke:#e3eae6;stroke-width:1}.axis{stroke:#84999c;stroke-width:1.5}.gridtext{fill:#637780;font:18px sans-serif}.equations{min-width:0}.equation-tools{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0}.part{margin-bottom:9px;border:1px solid var(--line);border-radius:7px;background:#fff}.part summary{padding:12px 14px;font-weight:700;cursor:pointer}.part summary .count{color:var(--sub);font-weight:400;font-size:13px}.part-body{padding:0 14px 14px}.part-actions{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}.formula-list{display:grid;gap:5px;margin:0;padding:0;list-style:none}.formula-list li{display:grid;grid-template-columns:35px minmax(0,1fr);gap:7px;align-items:start;padding:7px 8px;background:#f6f8f7;border-radius:5px}.formula-list .index{color:var(--sub);font-size:12px;text-align:right;padding-top:2px}.formula-list code{overflow-wrap:anywhere;font:14px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}.status{min-height:24px;color:var(--sub);font-size:13px}.empty{padding:20px;color:var(--sub)}
    @media(max-width:760px){header{padding:12px 15px}header h1{font-size:16px}main{padding:18px 14px 34px}.workspace-grid{grid-template-columns:1fr;gap:14px}.preview{position:static}.drawing{max-width:520px;margin:0 auto}.toolbar select{flex:1;min-width:150px}.login{margin-top:5vh;padding:20px}}
  </style>
</head>
<body>
  <header>
    <h1>픽토그램 수업 연구실 · 교사용</h1>
    <nav><a class="button" href="/">학생 화면</a><button id="logout" class="button" type="button" hidden>로그아웃</button></nav>
  </header>
  <main>
    <form id="login" class="login">
      <h2>교사용 로그인</h2>
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="button primary" type="submit">로그인</button>
      <p id="login-error" class="error" role="status" aria-live="polite"></p>
    </form>
    <section id="workspace" class="workspace" hidden>
      <div class="toolbar">
        <label for="icon-select">픽토그램</label>
        <select id="icon-select"></select>
        <button id="copy-all" class="button primary" type="button">그림 전체 식 복사</button>
        <span id="copy-status" class="status" role="status" aria-live="polite"></span>
      </div>
      <div class="workspace-grid">
        <section class="preview" aria-labelledby="drawing-title">
          <h2 id="drawing-title"></h2>
          <div id="drawing" class="drawing"></div>
        </section>
        <section class="equations" aria-labelledby="equations-title">
          <h2 id="equations-title">부분별 Desmos 식</h2>
          <div id="parts"></div>
        </section>
      </div>
    </section>
  </main>
  <script src="/teacher.js" defer></script>
</body>
</html>
