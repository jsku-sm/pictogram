services:
  - type: web
    name: pictogram-classroom
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: TEACHER_USERNAME
        value: teacher
      - key: TEACHER_PASSWORD
        sync: false
