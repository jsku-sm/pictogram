 const i=iconNow(),part=i.parts[state.part],r=rec();return `<div class="small" style="margin-bottom:9px">한 부분만 깊게 탐구해도 좋아요. 힌트는 필요할 때 열고, 다시 골라도 괜찮아요.</div>${partButtons()}<div class="part-caption">지금 탐구하는 곳 · ${state.part+1}. ${part.name}</div>${teacher?'':field('idea_'+state.part,'먼저 내 생각을 짧게 남겨 볼까요?','이 부분은 …처럼 보인다. 중심·끝점은 …쯤일 것 같다.',{rows:2})}${part.questions.map((q,qi)=>{
 const key=state.part+'_'+qi,h=r.hints[key]||{},open=h.open||teacher,pick=h.pick,has=Number.isInteger(pick),correct=pick===q.correct;
 return `<section class="question" id="q-${key}"><h4><span class="tag green" style="margin-right:7px">${qi+1}</span>${esc(q.prompt)}</h4>${!open?`<button class="btn soft hint-btn" data-action="hint" data-id="${key}" aria-expanded="false">힌트 보기 · 객관식</button>`:`<div class="clue">${esc(q.hint)}</div><div class="choice-stack">${q.options.map((o,oi)=>`<button class="choice ${has&&pick===oi?(correct?'selected':'retry'):''}" data-action="answer" data-id="${key}" data-choice="${oi}" aria-pressed="${has&&pick===oi}"><span class="choice-index">${oi+1}</span><span>${esc(o)}</span>${teacher&&oi===q.correct?'<span class="tag green" style="margin-left:auto">교사용 확인</span>':''}</button>`).join('')}</div>${has?`<div class="feedback ${correct?'':'retry'}" role="status"><strong>${correct?'잘 찾았어요.':'좋은 시도예요. 다시 살펴볼까요?'}</strong><br>${esc(correct?q.yes:q.no)}</div>`:''}`}</section>`;
 }).join('')}`;
}
function setHint(key,pick){
 const m=/^(\d+)_(\d+)$/.exec(key);if(!m)return;const q=iconNow().parts[+m[1]]?.questions[+m[2]];if(!q)return;
 const r=rec(),v=r.hints[key]||{open:false,pick:null,tries:0};v.open=true;if(pick!==undefined&&Number.isInteger(pick)&&q.options[pick]){v.pick=pick;v.tries++;}r.hints[key]=v;persist();
 const y=window.scrollY;renderWorkPanel();window.scrollTo(0,y);
}
function workPackage(){persist();return {format:'picto-lab-work',version:1,exported:new Date().toISOString(),alias:state.alias||'익명',major:state.major,interests:state.interests,records:Object.fromEntries(Object.entries(state.records).filter(([id,r])=>MAP[id]&&hasWork(r)))};}
function exportWork(){const pack=workPackage();if(!Object.keys(pack.records).length){toast('먼저 그림을 골라 생각을 한 줄 남겨 주세요.');return;}download(`픽토그램_학습기록_${(state.alias||'익명').replace(/[^가-힣a-zA-Z0-9_-]/g,'_')}.json`,JSON.stringify(pack,null,2),'application/json;charset=utf-8');toast('기록 파일을 저장했어요. 선생님께 이 파일을 제출할 수 있어요.');}
function parsePackage(raw){
 if(!raw||raw.format!=='picto-lab-work'||raw.version!==1||!raw.records||typeof raw.records!=='object'||Array.isArray(raw.records))throw Error('이 앱에서 저장한 학습 기록 JSON이 아닙니다.');
 const records={};for(const icon of ICONS)if(raw.records[icon.id])records[icon.id]=cleanRecord(raw.records[icon.id],icon);
 if(!Object.keys(records).length)throw Error('알려진 픽토그램의 학습 기록이 없습니다.');
 return {alias:txt(raw.alias,24)||'익명',major:DATA.majors.some(m=>m.id===raw.major)?raw.major:'',interests:Array.isArray(raw.interests)?raw.interests.filter(v=>typeof v==='string').slice(0,12):[],records};
}
async function importWork(file){
 if(!file)return;if(file.size>10000000){toast('10MB 이하 기록 파일만 불러올 수 있어요.');return;}
 try{const pack=parsePackage(JSON.parse(await file.text()));const dup=Object.keys(pack.records).some(k=>hasWork(state.records[k]));if(dup&&!confirm('같은 그림의 기존 기록을 불러온 기록으로 바꿀까요? 현재 기록을 먼저 파일로 저장할 수 있습니다.'))return;
 Object.assign(state.records,pack.records);state.alias=pack.alias;state.major=pack.major;state.interests=pack.interests.filter(v=>majorInfo()?.interests.some(t=>t[0]===v));persist();closeModal();renderHome();toast('학습 기록을 불러왔어요. 기록이 있는 그림에서 이어서 하세요.');}
 catch(e){toast('불러오기 실패: '+e.message);}
}
function libraryModal(){
 const list=ICONS.filter(i=>hasWork(state.records[i.id]));modal('나의 탐구 기록',`<p class="small">기록은 이 브라우저에 저장됩니다. 기기 변경·공용 기기 사용 전에는 파일로 보관하세요. 자동 제출·자동 동기화는 하지 않습니다.</p><div class="field" style="margin-top:18px"><label for="alias-input">내 표시 (선택)</label><input id="alias-input" placeholder="예: 3모둠 A · 실명 없이 사용" maxlength="24" value="${esc(state.alias)}"></div><div class="row"><button class="btn primary" data-action="export">기록 파일 저장</button><label class="btn">기록 불러오기<input id="import-work" type="file" accept="application/json,.json" class="sr-only"></label></div><div style="margin-top:18px">${list.length?list.map(i=>`<div class="library-item"><div><strong>${i.name}</strong><p>${state.records[i.id].first?'처음 식 기록 완료':'관찰·탐구 진행 중'} · 수정 기록 ${state.records[i.id].history?.length||0}개</p></div><button class="btn smallbtn" data-action="resume" data-id="${i.id}">이어서 하기</button></div>`).join(''):'<div class="empty" style="padding:24px;margin-top:15px"><p>아직 기록이 없어요. 마음에 드는 그림을 골라 시작해 보세요.</p></div>'}</div><div class="rule"></div><button class="btn danger" data-action="clear-local">이 기기의 내 기록 지우기</button><p class="small" style="margin-top:10px">파일로 저장한 기록은 지워지지 않습니다. 공용 기기에서는 저장 후 초기화하세요.</p>`);
}
async function attachImage(file){
 if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>6000000){toast('6MB 이하 PNG·JPG·WEBP 이미지를 선택하세요.');return;}
 const reader=new FileReader();reader.onerror=()=>toast('이미지를 읽지 못했어요.');reader.onload=()=>{const im=new Image();im.onerror=()=>toast('이미지 형식을 확인해 주세요.');im.onload=()=>{const ratio=Math.min(1,1200/im.width,1200/im.height);const c=document.createElement('canvas');c.width=Math.round(im.width*ratio);c.height=Math.round(im.height*ratio);const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);rec().image=c.toDataURL('image/jpeg',.78);persist();renderWorkPanel();toast('이 기기에 그래프 화면을 보관했어요.');};im.src=reader.result;};reader.readAsDataURL(file);
}
function printReport(){
 const i=iconNow();if(!i)return;const r=rec();const first=r.first;const last=r.history?.at(-1);let body=`<div class="print-head"><div><p>공통수학2 · 픽토그램 속 도형의 방정식</p><h1>${i.name} · 생각의 기록</h1><p>${esc(state.alias||'이름 대신 나의 표시: __________')} / ${esc(majorInfo()?.name||'전공: __________')}</p><p>${new Date().toLocaleDateString('ko-KR')}</p></div>${plot(i,{grid:true})}</div>`;
 if(ROLE==='teacher')body+=teacherPrint(i);
 else{
  const blocks=[['1. 선택과 관찰',`선택 이유: ${r.plan_reason||'________________'}\n관찰: ${r.plan_observe||'________________'}`],['2. 처음 세운 식',first?.formula||r.firstDraft||'________________'],['도형 선택의 이유',first?.reason||r.firstReason||'________________'],['3. 그래프로 확인한 점',r.observed||'________________'],['4. 수정한 식',r.revised||last?.formula||'________________'],['무엇을 왜 바꾸었나',`${r.changed||'________________'}\n${r.why||'________________'}`],['5. 검증 근거와 새 상황',`${r.evidence||'________________'}\n전이 질문: ${i.transfer}\n나의 답: ${r.transfer||'________________'}`],['성찰',`${r.feeling||'________________'}\n지금 상태: ${r.selfcheck||'________________'}`]];
  body+=blocks.map(([t,s])=>`<section class="print-block"><h3>${t}</h3><pre>${esc(s)}</pre></section>`).join('');
  if(r.image)body+=`<section class="print-block"><h3>내 Desmos 그래프 화면</h3><img class="sheet-image" src="${r.image}" alt="학생이 첨부한 그래프"></section>`;
  if(r.history?.length>1)body+=`<section class="print-block"><h3>수정 이력 ${r.history.length}회</h3>${r.history.map((h,n)=>`<p>${n+1}. ${esc(dateText(h.time))}</p><pre>${esc(h.formula+'\n'+h.why)}</pre>`).join('')}</section>`;
 }
 body+='<p class="stamp">결과의 아름다움보다 도형을 선택하고 식·범위를 검증한 과정을 봅니다. 이 학습지는 학생 응답의 자동 채점 결과가 아닙니다.</p>';
 $('#print-area').innerHTML=`<div class="print-report">${body}</div>`;window.print();
}
function helpModal(){modal('처음 사용하는 분께',helpContent());}
function commonHelp(){return `<section class="help-section"><h3>사용 순서</h3><p>전공 선택 → 세부 관심 분야 여러 개 선택 → 픽토그램 선택 → 한 부분 탐구 → 내 첫 식 기록 → Desmos에서 검증 → 수정 이유 기록 순서입니다. 그림은 모든 장식을 따라 그리기보다 일부부터 시작해도 됩니다.</p></section><section class="help-section"><h3>그림과 도형 수</h3><p>20개의 단순 윤곽선 모델입니다. 원호는 원의 일부로 따로 세며, 선분은 범위를 제한한 직선입니다. 점은 독립적으로 입력한 점만 셉니다. 도형을 나누는 방법은 여러 가지이므로 표시한 수는 유일한 정답이나 최소 개수가 아닙니다.</p></section><section class="help-section"><h3>기록 저장과 개인정보</h3><p>로그인·외부 서버 업로드·분석 도구 없이 작동합니다. 입력은 현재 브라우저의 저장 공간에 남고 교사에게 자동 전송되지 않습니다. 파일로 직접 열거나 시크릿 모드이면 저장이 제한될 수 있습니다. 중요한 기록은 JSON 파일로 저장하세요. 공용 기기에서는 사용 후 ‘나의 기록’에서 초기화하세요.</p><p>그림·질문은 오프라인에서도 동작합니다. Desmos를 새 창으로 열려면 인터넷이 필요합니다. 입력한 식을 Desmos에 자동 전송하거나 자동 채점하지 않습니다.</p></section><section class="help-section"><h3>개념 질문을 위한 힌트</h3><p>힌트 보기를 누르면 선택지가 나타납니다. 잘못 골라도 다시 살펴볼 질문을 제공합니다. 힌트가 개념을 확인해 주더라도 실제 식은 직접 세우고, 그래프와 좌표로 검증해 보세요. 그림별 탐구를 모두 끝낼 필요는 없어요.</p></section><section class="help-section"><h3>공식 도움말</h3><p class="small">2026-09-10 제작 참고 자료</p><a href="https://help.desmos.com/hc/en-us/articles/4407885334285-Inequalities-and-Restrictions" target="_blank" rel="noopener noreferrer">Desmos · 중괄호 범위 제한</a><br><a href="https://developer.mozilla.org/en-US/docs/Web/API/Clipboard/writeText" target="_blank" rel="noopener noreferrer">MDN · 복사 기능의 환경 조건</a><br><a href="https://developer.mozilla.org/en-US/docs/Web/API/Window/localStorage" target="_blank" rel="noopener noreferrer">MDN · 브라우저 저장 공간</a></section>`;}
function goStep(step){state.step=Math.max(0,Math.min(4,step));rec().lastStep=state.step;persist();renderWorkPanel();const panel=$('.work-panel');if(window.innerWidth<801)panel.scrollIntoView({behavior:'smooth',block:'start'});}
function commonAction(action,el){
 switch(action){
 case'home':persist();renderHome();window.scrollTo(0,0);return true;
 case'major':state.major=el.dataset.id;state.interests=[];persist();renderHome();return true;
 case'interest':{const id=el.dataset.id;state.interests=state.interests.includes(id)?state.interests.filter(t=>t!==id):[...state.interests,id];persist();renderHome();return true;}
 case'clear-interests':state.interests=[];persist();renderHome();return true;
 case'reset-filters':state.level=0;state.search='';persist();renderHome();return true;
 case'open':openIcon(el.dataset.id);return true;
 case'resume':closeModal();openIcon(el.dataset.id);return true;
 case'grid':state.grid=!state.grid;persist();refreshPreview();return true;
 case'counts':rec().revealCounts=true;persist();refreshPreview();if(ROLE==='student'&&state.step===0)renderWorkPanel();return true;
 case'part':state.part=Math.max(0,Math.min(iconNow().parts.length-1,Number(el.dataset.id)));renderWorkPanel();return true;
 case'hint':setHint(el.dataset.id);return true;
 case'answer':setHint(el.dataset.id,Number(el.dataset.choice));return true;
 case'help':helpModal();return true;
 case'close':closeModal();return true;
 case'png':savePNG();return true;
 case'library':libraryModal();return true;
 case'export':exportWork();return true;
 case'print':printReport();return true;
 case'clear-local':if(confirm('이 기기에 저장된 탐구 기록을 모두 지울까요? 필요한 기록은 먼저 파일로 저장하세요.')){state.records={};state.alias='';persist();closeModal();renderHome();toast('이 기기의 학습 기록을 지웠어요.');}return true;
 default:return false;
 }
}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-action]');if(el){if(!commonAction(el.dataset.action,el))roleAction(el.dataset.action,el);return;}
 const s=e.target.closest('.plot-area [data-part]');if(s&&(ROLE==='teacher'||state.step===1)){state.part=Number(s.dataset.part);renderWorkPanel();}
});
document.addEventListener('input',e=>{
 if(e.target.id==='search'){state.search=e.target.value;renderCatalog();return;}
 if(e.target.id==='alias-input'){state.alias=e.target.value.slice(0,24);queueSave();return;}
 const key=e.target.dataset.field;if(key&&iconNow()&&(TEXT_FIELDS.includes(key)||/^idea_\d+$/.test(key))){rec()[key]=e.target.value.slice(0,5000);queueSave();}
});
document.addEventListener('change',e=>{
 if(e.target.id==='level'){state.level=Number(e.target.value);persist();renderCatalog();}

 if(e.target.id==='graph-image')attachImage(e.target.files[0]);
 if(e.target.dataset.field&&iconNow()){const key=e.target.dataset.field;if(TEXT_FIELDS.includes(key)){rec()[key]=e.target.value.slice(0,5000);persist();}}
 roleChange(e);
});

function helpContent(){return `<section class="help-section"><h3>이곳은 학생용 작업실이에요.</h3><p>완성된 정답 수식 대신, 직접 생각할 질문과 선택형 힌트를 제공합니다. 선택지가 맞았다고 그림의 식까지 완성된 것은 아니에요. 찾은 중심·거리·방향·범위를 이용해 자신의 식을 세우고 Desmos에서 확인하세요.</p><p>‘처음 식 남기기’로 저장한 첫 생각은 바뀌지 않습니다. 다음 단계에서 수정 기록을 여러 번 추가해 보세요. 오류가 없어도 무엇으로 확인했는지 쓰면 됩니다. 기록은 선생님께 자동 전송되지 않아요.</p></section>${commonHelp()}`;}

function studentPanel(){const i=iconNow(),r=rec();
 if(state.step===0)return `<div class="section-top"><div class="eyebrow">SEE · ESTIMATE</div><h2>무엇이 보이나요?</h2><p>처음부터 식을 쓰지 않아도 괜찮아요. 그림을 기본 도형으로 나누어 봅시다.</p></div>${field('plan_reason','이 그림과 내 관심은 어떻게 연결되나요?','나는 …에 관심이 있어서 이 그림을 골랐다.',{rows:2})}${field('plan_observe','그림에서 어떤 도형과 관계가 보이나요?','… 부분은 동그랗고, … 부분은 곧게 이어져 있다. 두 선은 … 같다.',{rows:2})}<div class="field-label">먼저 도형 수를 예상해 볼까요? <span class="small">선택 활동</span></div><div class="estimate-grid">${Object.entries(KIND).map(([k,l])=>`<div class="field"><label for="estimate-${k}">${l}</label><input id="estimate-${k}" data-field="estimate_${k}" type="number" min="0" max="40" inputmode="numeric" placeholder="?" value="${esc(r['estimate_'+k])}"></div>`).join('')}</div><button class="btn soft" data-action="counts" style="margin-top:15px">내 예상과 예시 구성 비교하기</button>${r.revealCounts?`<div class="callout"><strong>이 그림에서는 이렇게 나누었어요.</strong>${counts(i,true)}<p style="margin-top:8px">도형을 나누는 방법은 여러 가지예요. 수가 다르면 왜 다르게 세었는지 말해 보세요. 선분의 끝점은 점 개수에 다시 더하지 않아요.</p></div>`:''}<div class="instruction">전체를 완성하기 부담스럽다면 가장 쉬운 부분 하나부터 골라 보세요. 한 부분을 제대로 설명하는 것도 좋은 출발이에요.</div>`;

 if(state.step===2){

  return `<div class="section-top"><div class="eyebrow">FIRST TRY · PREDICT BEFORE TESTING</div><h2>먼저 내 식을 세워요.</h2><p>전체 그림이 아니라 한 부분의 식이면 충분해요. 아직 틀려도 괜찮습니다.</p></div><div class="field"><label for="first-part">어느 부분을 만들려고 하나요?</label><select id="first-part" data-field="firstPart">${i.parts.map((p,j)=>`<option value="${j}" ${Number(r.firstPart===''?state.part:r.firstPart)===j?'selected':''}>${j+1}. ${p.name}</option>`).join('')}</select></div>${field('firstDraft','처음 생각한 식','내가 세운 식을 직접 입력하세요.',{formula:true,rows:3,small:'x, y, 숫자, ^2 등을 사용해 자유롭게 적어 보세요. 앱이 이 식을 자동 채점하지 않습니다.'})}${field('firstReason','왜 이 도형과 식을 선택했나요?','나는 … 부분을 … 도형으로 보았다. …을 표현하려고 이 식을 선택했다.',{rows:3})}<button class="btn primary" data-action="freeze-first">처음 식 남기기</button><p class="small" style="margin-top:10px">버튼을 누르면 첫 생각이 고정됩니다. 이후 수정해도 이 기록은 남아요.</p>`;
 }
 if(state.step===3){

  return `<div class="section-top"><div class="eyebrow">CHECK · REVISE</div><h2>그래프가 무엇을 말하나요?</h2><p>새 창에서 내 식을 직접 입력하고 예시 그림과 비교하세요. 한 번에 한 수나 조건만 바꾸어 봅시다.</p></div><a class="btn dark" href="https://www.desmos.com/calculator?lang=ko" target="_blank" rel="noopener noreferrer">Desmos 열기 ↗</a><p class="small" style="margin:8px 0 14px">새 창에 내 식을 직접 입력합니다. 이 앱이 식이나 그래프를 자동 전달하지는 않습니다.</p><div class="snapshot-box"><span class="label">처음 식 · ${esc(r.first.part)}</span><code>${esc(r.first.formula)}</code></div><div class="field-label">어느 점을 확인했나요? <span class="small">여러 개 선택</span></div><div class="checklist">${['위치','크기','방향','범위'].map(s=>`<button class="checkbtn ${r.checks.includes(s)?'active':''}" data-action="check" data-id="${s}" aria-pressed="${r.checks.includes(s)}">${r.checks.includes(s)?'✓ ':''}${s}</button>`).join('')}</div>${field('observed','그래프로 보니 어떤 점이 예상과 달랐나요?','… 부분이 예상보다 …에 있었다. / 처음 예상과 같았고 …을 확인했다.',{rows:2})}${field('changed','무엇을 바꾸거나 유지했나요?','중심의 가로 위치 / 반지름 / 기울기 / 선의 끝나는 범위 등',{rows:2})}${field('revised','수정한 식 또는 검증한 식','확인한 뒤의 식을 직접 입력하세요.',{rows:3,formula:true})}${field('why','왜 그렇게 바꾸었나요?','…을 표현하려고 …을 …으로 바꾸었다. 그 결과 …가 달라졌다.',{rows:3})}<button class="btn primary" data-action="add-revision">이번 검증·수정 기록 남기기</button>${r.history.length?`<details class="history"><summary>남겨 둔 검증·수정 기록 ${r.history.length}개</summary>${r.history.map((h,j)=>`<div class="revision-item"><strong>${j+1}번째 · ${esc(dateText(h.time))}</strong><code>${esc(h.formula)}</code><p>${esc(h.why)}</p></div>`).join('')}</details>`:''}<div class="rule"></div><div class="field-label">내 Desmos 화면도 남겨 둘까요? <span class="small">선택</span></div><p class="small" style="margin-bottom:12px">그래프 화면만 캡처해 올리세요. 얼굴·실명·계정 정보는 제외합니다. 이미지는 이 기기와 저장한 기록 파일에만 포함됩니다.</p><label class="btn">그래프 이미지 선택<input id="graph-image" type="file" accept="image/png,image/jpeg,image/webp" class="sr-only"></label>${r.image?`<img class="image-result" src="${r.image}" alt="내가 첨부한 그래프"><button class="textbtn small" data-action="remove-image">첨부 이미지 삭제</button>`:''}`;
 }
 return `<div class="section-top"><div class="eyebrow">EXPLAIN · TRANSFER · REFLECT</div><h2>고친 이유를 설명해요.</h2><p>친구에게 처음 생각과 지금 생각을 비교해 설명해 봅시다.</p></div>${r.first?`<div class="snapshot-box"><span class="label">나의 처음 식</span><code>${esc(r.first.formula)}</code></div>`:''}${r.history.length?`<div class="snapshot-box"><span class="label">최근에 확인한 식</span><code>${esc(r.history.at(-1).formula)}</code></div>`:'<div class="callout warn">아직 검증·수정 기록을 남기지 않았어요. 이전 단계에서 버튼을 눌러 한 번의 생각을 보관해 주세요.</div>'}${field('evidence','내 식이 맞는다는 근거는 무엇인가요?','중심·반지름·지나는 점·양 끝점 중 무엇을 확인했는지 써 보세요.',{rows:3})}${field('transfer',i.transfer,'식의 어떤 수나 조건이 변하고, 무엇이 변하지 않을지 생각해 보세요.',{rows:3})}${field('feeling','처음과 지금, 생각이나 느낌은 어떻게 달라졌나요?','처음에는 …라고 생각했다. 지금은 …라고 생각한다. 내가 직접 해낸 것은 …이다.',{rows:3})}<div class="field"><label for="self-check">지금 내 상태에 가까운 것은?</label><select id="self-check" data-field="selfcheck"><option value="">선택하세요 · 점수가 아닙니다.</option>${['식과 범위를 바꾸고 이유도 설명할 수 있다.','다른 점은 알지만 식을 바꿀 때 도움이 필요하다.','도형을 식으로 나타내는 것부터 더 연습하고 싶다.'].map(s=>`<option ${r.selfcheck===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="row"><button class="btn" data-action="print">과정 학습지 인쇄·PDF 저장</button><button class="btn soft" data-action="library">내 기록 모아 보기</button></div><div class="callout"><strong>잘한 것은 정답만이 아니에요.</strong>한 부분을 관찰하고, 시도하고, 근거를 찾아 다시 생각한 과정을 남겼어요. 기록 파일을 저장한 뒤 선생님이 정한 제출 공간에 직접 제출하세요.</div>`;
}
function roleAction(action,el){const r=rec();
 switch(action){
  case'step':goStep(Number(el.dataset.id));break;
  case'freeze-first':{
   if(r.first){toast('첫 생각은 이미 보관되어 있어요. 다음 단계에서 고쳐 보세요.');break;}
   if(!r.firstDraft?.trim()){toast('먼저 내가 생각한 식을 한 줄 적어 주세요.');$('#f-firstDraft')?.focus();break;}
   if(!r.firstReason?.trim()){toast('이 식을 선택한 이유도 짧게 남겨 주세요.');$('#f-firstReason')?.focus();break;}
   const j=Math.max(0,Math.min(iconNow().parts.length-1,Number(r.firstPart===''?state.part:r.firstPart)));
   r.first={formula:r.firstDraft.trim(),reason:r.firstReason.trim(),part:iconNow().parts[j].name,time:new Date().toISOString()};persist();renderWorkPanel();toast('첫 생각을 보관했어요. 이제 그래프로 확인해 봅시다.');break;
  }
  case'check':r.checks=r.checks.includes(el.dataset.id)?r.checks.filter(x=>x!==el.dataset.id):[...r.checks,el.dataset.id];persist();el.classList.toggle('active');el.setAttribute('aria-pressed',r.checks.includes(el.dataset.id));el.textContent=(r.checks.includes(el.dataset.id)?'✓ ':'')+el.dataset.id;break;
  case'add-revision':{
   if(!r.first)return goStep(2);
   if(!r.revised?.trim()||!r.observed?.trim()||!r.why?.trim()){toast('확인한 점·수정 식·수정 이유를 모두 짧게 남겨 주세요.');break;}
   const h={formula:r.revised.trim(),observed:r.observed.trim(),changed:r.changed||'',why:r.why.trim(),time:new Date().toISOString()};const prev=r.history.at(-1);
   if(prev&&prev.formula===h.formula&&prev.observed===h.observed&&prev.why===h.why){toast('같은 기록이 이미 있어요. 새롭게 바꾼 내용이 있으면 추가하세요.');break;}
   r.history.push(h);r.history=r.history.slice(-20);persist();const y=window.scrollY;renderWorkPanel();window.scrollTo(0,y);toast('이번 검증·수정 과정을 남겼어요. 최대 20회까지 보관합니다.');break;
  }
  case'remove-image':delete r.image;persist();renderWorkPanel();break;
 }
}
